<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1: Carousel</title>
    <style>
        body{font-family:sans-serif;display:flex;flex-direction:column;align-items:center;}
        .carousel-container{position:relative;width:100%;max-width:600px;overflow:hidden;border-radius:10px;}
        .carousel-slide{display:flex;transition:transform 0.5s ease-in-out;}
        .carousel-slide img{width:100%;flex-shrink:0;}
        .btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.5);color:white;border:none;padding:10px;cursor:pointer;font-size:18px;}
        .prev{left:10px;} .next{right:10px;}
        .explanation{margin-top:20px;background:#f4f4f4;padding:15px;max-width:600px;border-radius:8px;}
    </style>
</head>
<body>
    <h2>Bài 1: Image Carousel</h2>
    <div class="carousel-container">
        <div class="carousel-slide" id="slide">
            <img src="https://picsum.photos/600/300?random=1" alt="Img 1">
            <img src="https://picsum.photos/600/300?random=2" alt="Img 2">
            <img src="https://picsum.photos/600/300?random=3" alt="Img 3">
            <img src="https://picsum.photos/600/300?random=4" alt="Img 4">
            <img src="https://picsum.photos/600/300?random=5" alt="Img 5">
            <img src="https://picsum.photos/600/300?random=6" alt="Img 6">
        </div>
        <button class="btn prev" id="prevBtn">&#10094;</button>
        <button class="btn next" id="nextBtn">&#10095;</button>
    </div>

    <div class="explanation">
        <strong>Giải thích Logic:</strong><br>
        - <b>Xử lý Index:</b> Dùng biến <code>counter</code>. Khi bấm Next, tăng counter. Nếu <code>counter >= số ảnh</code>, reset về 0. Ngược lại với Prev.<br>
        - <b>Animation:</b> Dùng <code>transform: translateX()</code> thay đổi vị trí theo % chiều rộng.<br>
        - <b>Tự động:</b> Dùng <code>setInterval</code> chạy mỗi 3000ms.
    </div>

    <script>
        const slide = document.getElementById('slide');
        const images = document.querySelectorAll('.carousel-slide img');
        let counter = 0;
        const size = images[0].clientWidth;

        function updateSlide() {
            slide.style.transform = 'translateX(' + (-size * counter) + 'px)';
        }

        function nextSlide() {
            if (counter >= images.length - 1) counter = 0;
            else counter++;
            updateSlide();
        }

        function prevSlide() {
            if (counter <= 0) counter = images.length - 1;
            else counter--;
            updateSlide();
        }

        document.getElementById('nextBtn').addEventListener('click', nextSlide);
        document.getElementById('prevBtn').addEventListener('click', prevSlide);
        setInterval(nextSlide, 3000); // Tự động chạy sau 3s
    </script>
</body>
</html>
